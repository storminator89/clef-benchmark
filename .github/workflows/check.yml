name: Reproducibility and workbench checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Show test runtime versions
        run: |
          python --version
          node --version
      - name: Verify original frozen datasets, lineage and final metrics
        run: python scripts/check_project.py
      - name: Verify follow-up inputs, completed runs and exact metrics
        run: python scripts/check_followups.py
      - name: Verify frozen bank-support export, safety metrics and previous results
        run: python scripts/check_bank_support.py
      - name: Verify clarification72 and immutable earlier artifacts
        run: python scripts/check_clarification.py
      - name: Verify paired results and per-field reliability with original source preservation
        run: python scripts/check_paired_reliability.py
      - name: Run standard-library server, importer and adapter tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild six suite datasets and two separate diagnostic datasets
        run: |
          git ls-files --error-unmatch web/data/benchmark.json web/data/finance.json web/data/clean72.json web/data/insurance.json web/data/bank-support.json web/data/clarification.json web/data/minimal_pairs.json web/data/reliability.json
          python scripts/build_web_data.py --suite general
          python scripts/build_web_data.py --suite finance
          python scripts/build_clean_web_data.py
          python scripts/build_insurance_web_data.py
          python scripts/build_bank_web_data.py
          python scripts/build_clarification_web_data.py
          python scripts/build_minimal_pairs_web_data.py
          python scripts/build_reliability_web_data.py
          git diff --exit-code -- web/data/
      - name: Install pinned DOM test dependency (no runtime dependency)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run UI logic and pure DOM regressions (no browser or model)
        run: npm test
