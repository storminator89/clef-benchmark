# Reviewed activation template. Publish this code first; install only with an
# immutable reviewed code commit in place of 5ac03db03857cb3d8945affcd5c769878890f14b.
# Manual dispatch is required; a push never calls the provider.
name: Jev continue 793 unattempted cases
on:
  workflow_dispatch:
    inputs:
      approve_public_data:
        description: 'Approve only the 793 never-attempted frozen text requests; do not resend the first 181'
        type: boolean
        required: true
        default: false
      approve_api_three_usd:
        description: 'Keep the prior 181 reservations within the shared 1024-attempt / USD 3 local cap'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: jev-bounded-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: >-
      github.repository == 'storminator89/clef-benchmark' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' &&
      inputs.approve_public_data && inputs.approve_api_three_usd
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout immutable reviewed code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5ac03db03857cb3d8945affcd5c769878890f14b
          persist-credentials: false
          fetch-depth: 1
      - name: Verify frozen inputs and test offline
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 experiments/jev_comparison/scripts/check_bundle.py
          python3 -m unittest discover -s experiments/jev_comparison/tests -v
          python3 -m unittest discover -s tests -p test_jev_continuation.py -v
          python3 scripts/run_jev_continuation.py --output "$RUNNER_TEMP/jev-plan.json"
      - name: Continue only unattempted cases with the original shared budget
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/run_jev_continuation.py --execute --approval continue-unattempted-public-text-793 --approved-api-usd 3 --output "$RUNNER_TEMP/jev-run"
      - name: Score complete and missing cases offline
        if: always()
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          if test -f "$RUNNER_TEMP/jev-run/predictions.jsonl"; then
            python3 experiments/jev_comparison/scripts/compare.py --run "$RUNNER_TEMP/jev-run" --output "$RUNNER_TEMP/jev-comparison"
          fi
      - name: Retain only sanitized bounded-run evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jev-continuation-${{ github.run_id }}
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
          path: |
            ${{ runner.temp }}/jev-plan.json
            ${{ runner.temp }}/jev-run/connection_check.json
            ${{ runner.temp }}/jev-run/validation_diagnostics.jsonl
            ${{ runner.temp }}/jev-run/attempts.jsonl
            ${{ runner.temp }}/jev-run/predictions.jsonl
            ${{ runner.temp }}/jev-run/run_summary.json
            ${{ runner.temp }}/jev-comparison/comparison_summary.json
            ${{ runner.temp }}/jev-comparison/field_metrics.json
            ${{ runner.temp }}/jev-comparison/special_diagnostics.json
            ${{ runner.temp }}/jev-comparison/latency.json
            ${{ runner.temp }}/jev-comparison/case_comparison.jsonl
